# Builds and tests the UIComponents Swift Package on the iOS Simulator.
# This is an iOS-only UIKit-backed library, so it must be built for iOS
# (not the macOS host that `swift build` would default to).
name: Swift

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Pick iOS Simulator
        id: sim
        run: |
          set -euo pipefail
          # iPhone disponível no runtime iOS mais recente instalado
          UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | sort_by(.key | capture("iOS-(?<maj>[0-9]+)-(?<min>[0-9]+)") | [(.maj|tonumber), (.min|tonumber)])
            | map(.value | map(select(.name | startswith("iPhone"))))
            | map(select(length > 0))
            | last
            | first
            | .udid // empty')
          if [ -z "$UDID" ]; then
            echo "::error::Nenhum simulador de iPhone disponível"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and test (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme UIComponents \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          
    lint:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container: ghcr.io/realm/swiftlint:latest
        steps:
        - uses: actions/checkout@v4
        - name: Lint
            run: swiftlint --strict --reporter github-actions-logging
