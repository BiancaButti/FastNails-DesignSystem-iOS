# Builds and tests the UIComponents Swift Package on the iOS Simulator.
# This is an iOS-only UIKit-backed library, so it must be built for iOS
# (not the macOS host that `swift build` would default to).
name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build and test (iOS Simulator)
      run: |
        UDID=$(xcrun simctl list devices available \
          | grep -m1 'iPhone' \
          | grep -oiE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}')
        echo "Using simulator $UDID"
        xcodebuild test \
          -scheme UIComponents \
          -destination "id=$UDID"
