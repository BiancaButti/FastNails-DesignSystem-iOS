# Builds and tests the UIComponents Swift Package on the iOS Simulator.
# This is an iOS-only UIKit-backed library, so it must be built for iOS
# (not the macOS host that `swift build` would default to).
name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build and test (iOS Simulator)
      run: |
        xcodebuild test \
          -scheme UIComponents \
          -destination 'platform=iOS Simulator,name=iPhone 15'
