included:
  - UIComponents/Sources
  - UIComponents/Tests

excluded:
  - .build
  - UIComponents/CatalogDemo/CatalogDemo.xcodeproj

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - sorted_first_last
  - closure_spacing

line_length:
  warning: 140
  error: 200
  ignores_comments: true
  ignores_urls: true